<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Engine Demo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>E-Commerce Engine</h1>
    <p>TDD demo storefront — 7.5% VAT, 10% discount above ₦10,000</p>
  </header>

  <main>
    <section id="products">
      <h2>Products</h2>
      <div id="product-list" class="product-grid"></div>
    </section>

    <aside id="cart">
      <h2>Your Cart</h2>
      <div id="cart-items"></div>
      <div id="cart-summary"></div>
      <button id="reset-cart">Clear Cart</button>
    </aside>
  </main>

  <div id="toast"></div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
